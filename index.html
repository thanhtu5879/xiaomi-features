<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tra cứu tính năng Xiaomi By Trần Thanh Tú </title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --orange: #FF6900;
    --orange-light: #FFF0E6;
    --orange-mid: #FFD4B3;
    --dark: #0F0F0F;
    --dark2: #1A1A1A;
    --dark3: #242424;
    --gray: #888;
    --gray-light: #F5F5F5;
    --white: #FFFFFF;
    --border: #E8E8E8;
    --radius: 12px;
    --radius-sm: 8px;
  }

  body {
    font-family: 'Be Vietnam Pro', sans-serif;
    background: var(--gray-light);
    color: var(--dark);
    min-height: 100vh;
  }

  /* HEADER */
  header {
    background: var(--dark);
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 56px;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
  }

  .logo-icon {
    width: 28px;
    height: 28px;
    background: var(--orange);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .logo-icon svg { width: 16px; height: 16px; }

  .logo-text {
    font-size: 14px;
    font-weight: 600;
    color: var(--white);
    letter-spacing: 0.3px;
  }

  .logo-sub {
    font-size: 11px;
    color: var(--gray);
    font-weight: 300;
  }

  .header-right {
    font-size: 12px;
    color: var(--gray);
  }

  /* HERO */
  .hero {
    background: var(--dark);
    padding: 40px 24px 32px;
    text-align: center;
  }

  .hero h1 {
    font-size: clamp(22px, 4vw, 32px);
    font-weight: 600;
    color: var(--white);
    line-height: 1.3;
    margin-bottom: 8px;
  }

  .hero h1 span { color: var(--orange); }

  .hero p {
    font-size: 14px;
    color: var(--gray);
    font-weight: 300;
    margin-bottom: 24px;
  }

  /* SEARCH */
  .search-wrap {
    max-width: 560px;
    margin: 0 auto;
    position: relative;
  }

  .search-wrap input {
    width: 100%;
    padding: 14px 20px 14px 48px;
    font-size: 15px;
    font-family: 'Be Vietnam Pro', sans-serif;
    border: 2px solid transparent;
    border-radius: var(--radius);
    background: var(--dark3);
    color: var(--white);
    outline: none;
    transition: border-color 0.2s;
  }

  .search-wrap input::placeholder { color: #555; }
  .search-wrap input:focus { border-color: var(--orange); }

  .search-icon {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    color: #555;
    width: 18px;
    height: 18px;
  }

  .clear-btn {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: #555;
    cursor: pointer;
    font-size: 18px;
    display: none;
    line-height: 1;
  }

  /* FILTERS */
  .filters {
    background: var(--dark2);
    padding: 12px 24px;
    display: flex;
    gap: 8px;
    overflow-x: auto;
    scrollbar-width: none;
    border-bottom: 1px solid #2A2A2A;
  }

  .filters::-webkit-scrollbar { display: none; }

  .filter-btn {
    flex-shrink: 0;
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid #333;
    background: transparent;
    color: var(--gray);
    font-size: 12px;
    font-family: 'Be Vietnam Pro', sans-serif;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }

  .filter-btn:hover { border-color: var(--orange); color: var(--orange); }
  .filter-btn.active { background: var(--orange); border-color: var(--orange); color: var(--white); font-weight: 500; }

  /* TRENDING */
  .trending-bar {
    background: var(--white);
    padding: 10px 24px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    scrollbar-width: none;
  }

  .trending-bar::-webkit-scrollbar { display: none; }

  .trending-label {
    font-size: 11px;
    color: var(--gray);
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .trend-tag {
    flex-shrink: 0;
    font-size: 12px;
    padding: 4px 12px;
    border-radius: 20px;
    background: var(--orange-light);
    color: var(--orange);
    cursor: pointer;
    font-weight: 500;
    transition: background 0.15s;
    white-space: nowrap;
    border: none;
  }

  .trend-tag:hover { background: var(--orange-mid); }

  /* MAIN */
  .main {
    max-width: 800px;
    margin: 0 auto;
    padding: 24px 16px;
  }

  .results-info {
    font-size: 12px;
    color: var(--gray);
    margin-bottom: 16px;
    padding: 0 4px;
  }

  /* CARDS */
  .card {
    background: var(--white);
    border-radius: var(--radius);
    margin-bottom: 10px;
    border: 1px solid var(--border);
    overflow: hidden;
    transition: box-shadow 0.2s;
  }

  .card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.08); }

  .card-header {
    padding: 16px 20px;
    cursor: pointer;
    display: flex;
    align-items: flex-start;
    gap: 14px;
  }

  .cat-dot {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 16px;
    margin-top: 1px;
  }

  .card-info { flex: 1; min-width: 0; }

  .card-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--dark);
    margin-bottom: 4px;
    line-height: 1.3;
  }

  .card-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .badge {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 4px;
    font-weight: 500;
  }

  .card-desc {
    font-size: 13px;
    color: var(--gray);
    font-weight: 300;
    margin-top: 4px;
    line-height: 1.5;
  }

  .chevron {
    color: #CCC;
    transition: transform 0.25s;
    flex-shrink: 0;
    margin-top: 8px;
  }

  .card.open .chevron { transform: rotate(180deg); color: var(--orange); }

  /* CARD BODY */
  .card-body {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.3s ease;
  }

  .card.open .card-body { max-height: 600px; }

  .card-body-inner {
    padding: 0 20px 20px 20px;
    border-top: 1px solid var(--border);
  }

  .steps-title {
    font-size: 11px;
    font-weight: 600;
    color: var(--gray);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    padding: 14px 0 10px;
  }

  .step {
    display: flex;
    gap: 12px;
    align-items: flex-start;
    margin-bottom: 8px;
  }

  .step-num {
    min-width: 22px;
    height: 22px;
    background: var(--orange);
    color: white;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 600;
    flex-shrink: 0;
    margin-top: 1px;
  }

  .step-text {
    font-size: 14px;
    color: var(--dark);
    line-height: 1.5;
    font-weight: 400;
  }

  .benefit-box {
    margin-top: 14px;
    padding: 12px 14px;
    background: var(--orange-light);
    border-radius: var(--radius-sm);
    border-left: 3px solid var(--orange);
    font-size: 13px;
    color: #8B3A00;
    line-height: 1.5;
  }

  .benefit-label {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--orange);
    margin-bottom: 4px;
  }

  .note-box {
    margin-top: 10px;
    padding: 10px 14px;
    background: #F0F7FF;
    border-radius: var(--radius-sm);
    border-left: 3px solid #4A90D9;
    font-size: 13px;
    color: #1A4D7A;
    line-height: 1.5;
  }

  .product-box {
    margin-top: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--gray);
  }

  /* EMPTY / LOADING */
  .state-box {
    text-align: center;
    padding: 60px 20px;
    color: var(--gray);
  }

  .state-box .icon { font-size: 40px; margin-bottom: 12px; }
  .state-box p { font-size: 14px; }

  /* CATEGORY COLORS */
  .cat-man-hinh { background: #E6F1FB; }
  .cat-camera { background: #E1F5EE; }
  .cat-pin { background: #EAF3DE; }
  .cat-cai-dat { background: #FAEEDA; }
  .cat-ket-noi { background: #FBEAF0; }
  .cat-khac { background: #F1EFE8; }

  .badge-man-hinh { background: #E6F1FB; color: #185FA5; }
  .badge-camera { background: #E1F5EE; color: #0F6E56; }
  .badge-pin { background: #EAF3DE; color: #3B6D11; }
  .badge-cai-dat { background: #FAEEDA; color: #854F0B; }
  .badge-ket-noi { background: #FBEAF0; color: #993556; }
  .badge-khac { background: #F1EFE8; color: #5F5E5A; }

  @media (max-width: 600px) {
    .hero { padding: 20px 16px 20px; }
    .hero h1 { font-size: 20px; margin-bottom: 6px; }
    .hero p { font-size: 13px; margin-bottom: 16px; display: none; }
    .search-wrap input { padding: 14px 44px 14px 44px; font-size: 16px; border-radius: 10px; }
    .filters { padding: 10px 12px; gap: 6px; }
    .filter-btn { padding: 8px 14px; font-size: 13px; }
    .trending-bar { padding: 8px 12px; gap: 8px; }
    .trend-tag { font-size: 13px; padding: 6px 12px; }
    .main { padding: 12px 10px; }
    .card-header { padding: 14px 14px; gap: 10px; }
    .cat-dot { width: 32px; height: 32px; font-size: 15px; border-radius: 8px; }
    .card-title { font-size: 14px; }
    .card-desc { font-size: 13px; }
    .card-body-inner { padding: 0 14px 16px; }
    .step-text { font-size: 14px; }
    .benefit-box { font-size: 13px; }
    header { padding: 0 14px; }
    .logo-sub { display: none; }
  }
</style>
</head>

<script>
const SHEET_ID = '1_BpsY4izWhR9xyKww9vRviUIs7icMIfVxeXXZEZePMA';
const API = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=`;

let features = [], steps = [], trending = [];
let activeFilter = 'all', searchQ = '';

const catMap = {
  'Màn hình': { cls: 'man-hinh', icon: '📱' },
  'Camera': { cls: 'camera', icon: '📷' },
  'Pin': { cls: 'pin', icon: '🔋' },
  'Cài đặt': { cls: 'cai-dat', icon: '⚙️' },
  'Kết nối': { cls: 'ket-noi', icon: '📶' },
  'Khác': { cls: 'khac', icon: '✨' },
};

function getCat(name) {
  return catMap[name] || { cls: 'khac', icon: '✨' };
}

async function fetchSheet(sheetName) {
  const res = await fetch(API + encodeURIComponent(sheetName));
  const text = await res.text();
  const json = JSON.parse(text.substring(47).slice(0, -2));
  const rawCols = json.table.cols.map(c => c.label ? c.label.trim() : '');
  const rows = json.table.rows;
  if (!rows || rows.length === 0) return [];

  // Kiểm tra xem cols từ API có đủ tên thật không
  // Nếu API trả về "A", "B", "C" hoặc trống → header nằm trong row đầu tiên
  const isRealHeader = rawCols.some(c => c && c.length > 1 && !/^[A-Z]$/.test(c));

  let cols, dataRows;
  if (isRealHeader) {
    cols = rawCols;
    dataRows = rows;
  } else {
    // Header nằm ở row đầu tiên (hàng 2 trong sheet vì hàng 1 trống)
    const headerRow = rows[0];
    cols = headerRow.c.map(cell => cell && cell.v ? String(cell.v).trim() : '');
    dataRows = rows.slice(1);
  }

  return dataRows.map(r => {
    const obj = {};
    cols.forEach((col, i) => {
      if (col) obj[col] = r.c[i] ? String(r.c[i].v ?? '').trim() : '';
    });
    return obj;
  }).filter(r => Object.values(r).some(v => v !== ''));
}

function escHtml(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Dữ liệu mẫu dự phòng (dùng khi không kết nối được Sheet)
const SAMPLE_FEATURES = [
  { feature_id:'F001', 'Tính năng':'Chia đôi màn hình', 'Danh mục':'Màn hình', 'Công dụng':'Sử dụng 2 ứng dụng cùng lúc trên một màn hình', 'Lợi ích':'Khách hàng có thể nhắn Zalo và xem YouTube cùng lúc', 'Dòng sản phẩm áp dụng':'Tất cả', 'Lưu ý':'RAM > 6GB mới sử dụng được' },
  { feature_id:'F002', 'Tính năng':'Chụp tài liệu', 'Danh mục':'Camera', 'Công dụng':'Tự động cắt ảnh khớp với giấy tờ và xuất thành file PDF', 'Lợi ích':'Tiết kiệm thời gian scan tài liệu, không cần máy scan', 'Dòng sản phẩm áp dụng':'Tất cả', 'Lưu ý':'' },
  { feature_id:'F003', 'Tính năng':'Chụp màn hình cuộn', 'Danh mục':'Màn hình', 'Công dụng':'Chụp toàn bộ nội dung dài trên một ảnh duy nhất', 'Lợi ích':'Lưu toàn bộ tin nhắn, trang web mà không cần chụp nhiều lần', 'Dòng sản phẩm áp dụng':'Tất cả', 'Lưu ý':'' },
  { feature_id:'F004', 'Tính năng':'Chế độ tiết kiệm pin', 'Danh mục':'Pin', 'Công dụng':'Kéo dài thời lượng pin khi sắp hết', 'Lợi ích':'Pin dùng được lâu hơn 30-50%', 'Dòng sản phẩm áp dụng':'Tất cả', 'Lưu ý':'Xuân Đạt đã đóng góp tính năng' },
  { feature_id:'F005', 'Tính năng':'Chụp ảnh ban đêm', 'Danh mục':'Camera', 'Công dụng':'Cải thiện độ sáng và giảm nhiễu khi chụp tối', 'Lợi ích':'Ảnh đêm sáng rõ, điểm mạnh so với đối thủ', 'Dòng sản phẩm áp dụng':'Tất cả', 'Lưu ý':'Các dòng sản phẩm thấp như Redmi có thể khác' },
  { feature_id:'F006', 'Tính năng':'Màn hình nổi', 'Danh mục':'Màn hình', 'Công dụng':'Hiển thị 1 ứng dụng dạng cửa sổ nổi trên màn hình', 'Lợi ích':'Xem video nhỏ trong khi làm việc khác', 'Dòng sản phẩm áp dụng':'Tất cả', 'Lưu ý':'' },
];

const SAMPLE_STEPS = [
  { feature_id:'F001', step_order:1, 'Nội dung':'Vuốt lên từ đáy màn hình để vào giao đa nhiệm' },
  { feature_id:'F001', step_order:2, 'Nội dung':'Nhấn giữ vào ứng dụng muốn chia' },
  { feature_id:'F001', step_order:3, 'Nội dung':'Chọn "Chia đôi màn hình"' },
  { feature_id:'F001', step_order:4, 'Nội dung':'Chọn ứng dụng thứ hai ở phần còn lại' },
  { feature_id:'F002', step_order:1, 'Nội dung':'Mở ứng dụng Máy ảnh' },

  { feature_id:'F002', step_order:5, 'Nội dung':'Chọn lưu ảnh hoặc xuất PDF' },
  { feature_id:'F003', step_order:1, 'Nội dung':'Chụp màn hình bình thường (nhấn nút nguồn + giảm âm lượng)' },
  { feature_id:'F003', step_order:2, 'Nội dung':'Nhấn vào biểu tượng "Cuộn" xuất hiện ở góc dưới' },
  { feature_id:'F003', step_order:3, 'Nội dung':'Kéo để chọn độ dài muốn chụp rồi lưu' },
  { feature_id:'F004', step_order:1, 'Nội dung':'Vào Cài đặt > Pin' },
  { feature_id:'F004', step_order:2, 'Nội dung':'Bật "Chế độ tiết kiệm điện"' },
  { feature_id:'F004', step_order:3, 'Nội dung':'Tùy chọn: bật "Tiết kiệm cực đại" khi pin dưới 15%' },
  { feature_id:'F005', step_order:1, 'Nội dung':'Mở ứng dụng Máy ảnh' },
  { feature_id:'F005', step_order:2, 'Nội dung':'Chọn chế độ "Đêm" (Night Mode)' },
  { feature_id:'F005', step_order:3, 'Nội dung':'Giữ điện thoại thẳng, nhấn chụp' },
  { feature_id:'F005', step_order:4, 'Nội dung':'Đợi máy xử lý 2-5 giây' },
  { feature_id:'F006', step_order:1, 'Nội dung':'Vào giao đa nhiệm (vuốt lên)' },
  { feature_id:'F006', step_order:2, 'Nội dung':'Nhấn giữ ứng dụng' },
  { feature_id:'F006', step_order:3, 'Nội dung':'Chọn "Cửa sổ nổi"' },
];

async function init() {
  try {
    [features, steps] = await Promise.all([
      fetchSheet('Feature'),
      fetchSheet('Steps')
    ]);
    if (!features.length) throw new Error('empty');
  } catch(e) {
    // Dùng dữ liệu mẫu khi không kết nối được Sheet
    features = SAMPLE_FEATURES;
    steps = SAMPLE_STEPS;
  }

  document.getElementById('count-display').textContent = features.length + ' tính năng';

  const topFeatures = features.slice(0, 5);
  const tBar = document.getElementById('trending-bar');
  topFeatures.forEach(f => {
    const btn = document.createElement('button');
    btn.className = 'trend-tag';
    btn.textContent = f['Tính năng'];
    btn.onclick = () => { document.getElementById('search-input').value = f['Tính năng']; onSearch(); };
    tBar.appendChild(btn);
  });

  render();
}

function getSteps(featureId) {
  return steps.filter(s => s['feature_id'] === featureId).sort((a, b) => {
    const aNum = parseInt(String(a['step_order']||'').replace(/\D/g,'')) || 0;
    const bNum = parseInt(String(b['step_order']||'').replace(/\D/g,'')) || 0;
    return aNum - bNum;
  });
}

function slugCat(cat) {
  return (catMap[cat] || {cls:'khac'}).cls;
}

function render() {
  const q = searchQ.toLowerCase().trim();
  let list = features.filter(f => {
    const ten = String(f['Tính năng'] || '').toLowerCase();
    const congDung = String(f['Công dụng'] || '').toLowerCase();
    const danhMuc = String(f['Danh mục'] || '').toLowerCase();
    const matchQ = !q || ten.includes(q) || congDung.includes(q) || danhMuc.includes(q);
    const matchF = activeFilter === 'all' || f['Danh mục'] === activeFilter;
    return matchQ && matchF;
  });

  const info = document.getElementById('results-info');
  info.textContent = q || activeFilter !== 'all' ? `Tìm thấy ${list.length} tính năng` : `${list.length} tính năng`;

  if (!list.length) {
    document.getElementById('results').innerHTML = `<div class="state-box"><div class="icon">🔍</div><p>Không tìm thấy tính năng phù hợp.<br>Thử từ khóa khác nhé.</p></div>`;
    return;
  }

  document.getElementById('results').innerHTML = list.map(f => {
    const cat = getCat(f['Danh mục']);
    const fid = f['feature_id'] || '';
    const fSteps = getSteps(fid);

    const stepsHTML = fSteps.map((s, i) => {
      // Thử tất cả tên cột có thể có
      const nd = s['Nội dung'] || s['Nội dung bước'] || s['noi_dung'] || '';
      return `<div class="step">
        <div class="step-num">${i+1}</div>
        <div class="step-text">${escHtml(nd)}</div>
      </div>`;
    }).join('');

    const noteVal = f['Lưu ý/Tên người đóng góp tính năng'] || f['Lưu ý'] || '';
    const noteHTML = noteVal ? `<div class="note-box"><strong style="font-size:10px;text-transform:uppercase;letter-spacing:0.8px;color:#4A90D9;">Lưu ý</strong><br>${escHtml(noteVal)}</div>` : '';
    const productVal = f['Dòng sản phẩm áp dụng'] || '';
    const productHTML = productVal && productVal !== 'Tất cả' ? `<div class="product-box"><svg width="12" height="12" viewBox="0 0 12 12" fill="none"><rect x="1" y="1" width="10" height="10" rx="2" stroke="#888" stroke-width="1.2"/><path d="M4 6h4M6 4v4" stroke="#888" stroke-width="1.2" stroke-linecap="round"/></svg>Áp dụng: <strong>${escHtml(productVal)}</strong></div>` : '';

    return `<div class="card" id="card-${escHtml(fid)}">
      <div class="card-header" onclick="toggleCard('${escHtml(fid)}')">
        <div class="cat-dot cat-${cat.cls}">${cat.icon}</div>
        <div class="card-info">
          <div class="card-title">${escHtml(f['Tính năng'])}</div>
          <div class="card-meta">
            <span class="badge badge-${cat.cls}">${escHtml(f['Danh mục'])}</span>
          </div>
          <div class="card-desc">${escHtml(f['Công dụng'])}</div>
        </div>
        <svg class="chevron" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6l4 4 4-4"/></svg>
      </div>
      <div class="card-body">
        <div class="card-body-inner">
          ${fSteps.length ? `<div class="steps-title">Các bước thực hiện</div>${stepsHTML}` : ''}
          ${noteHTML}
          ${productHTML}
        </div>
      </div>
    </div>`;
  }).join('');
}

function toggleCard(id) {
  const card = document.getElementById('card-' + id);
  const isOpen = card.classList.contains('open');
  document.querySelectorAll('.card.open').forEach(c => c.classList.remove('open'));
  if (!isOpen) card.classList.add('open');
}

function onSearch() {
  searchQ = document.getElementById('search-input').value;
  document.getElementById('clear-btn').style.display = searchQ ? 'block' : 'none';
  render();
}

function clearSearch() {
  document.getElementById('search-input').value = '';
  searchQ = '';
  document.getElementById('clear-btn').style.display = 'none';
  render();
}

function setFilter(cat, btn) {
  activeFilter = cat;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

document.getElementById('search-input').addEventListener('input', onSearch);
document.getElementById('search-input').addEventListener('keydown', e => { if(e.key === 'Escape') clearSearch(); });

init();
</script>
</body>
</html>
